[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectlens-backend"
version = "0.1.0"
description = "ProjectLens AI - Intelligent document analysis platform"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi[standard]>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "redis>=5.0,<6",
    "slowapi>=0.1.9,<1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "python-multipart>=0.0.6",
    "tiktoken>=0.7,<1",
    "aiohttp>=3.9,<4",
    "httpx>=0.26,<1",
    "supabase>=2.0,<3",
    "pymupdf>=1.23,<2",
    "python-docx>=1.1,<2",
    "psutil>=6.0,<7",
    "chromadb>=1.5,<2",
    "projectlens-shared",
    "projectlens-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "aiosqlite>=0.20,<1",
    "pytest-cov>=4.1,<6",
    "ruff>=0.2,<1",
    "black>=24.1,<25",
    "mypy>=1.8,<2",
]
ai = [
    "sentence-transformers>=2.7,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "D107", "D102", "SIM108", "SIM115", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"packages/core/src/core/interfaces/__init__.py" = ["E402"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.uv.sources]
projectlens-shared = { path = "../../packages/shared", editable = true }
projectlens-core = { path = "../../packages/core", editable = true }

