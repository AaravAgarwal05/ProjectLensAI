[project]
name = "projectlens-ai"
version = "0.1.0"
description = "Production-grade document analysis platform"
requires-python = ">=3.12"
authors = [
    {name = "ProjectLens AI Team", email = "team@projectlens.ai"},
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["document", "analysis", "ai", "nlp", "ocr"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["projectlens-backend"]

[project.urls]
homepage = "https://projectlens.ai"
repository = "https://github.com/projectlens-ai/projectlens"
documentation = "https://docs.projectlens.ai"

# ── uv workspace ─────────────────────────────────────────────────────
# Root depends on workspace members so `uv sync` installs everything
# into root .venv. Each member declares its own deps.
#   uv sync                     → installs everything into root .venv
#   uv add --package <name> <dep> → adds dep to the member's pyproject
[tool.uv.workspace]
members = ["apps/backend", "packages/*"]

[tool.uv.sources]
projectlens-backend = { workspace = true }

# ── Tooling config ───────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "D107", "D102", "SIM108", "SIM115", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
    | node_modules
    | \.next
    | dist
    | build
    | migrations
)/
'''

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = [
    "arg-type", "attr-defined", "assignment", "override",
    "return-value", "misc", "valid-type", "union-attr",
    "var-annotated", "import-untyped",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/backend/tests",
    "packages/core/tests",
    "packages/shared/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*", "*_test"]
addopts = "-v --tb=short --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*", "*/__init__.py"]
